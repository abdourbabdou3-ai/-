<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج - متجر الماسة</title>
    
    <!-- CSS Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-gold: #FFD700;
            --dark-gold: #B8860B;
            --primary-black: #1a1a1a;
            --secondary-black: #2d2d2d;
            --accent-white: #ffffff;
            --text-gray: #666;
            --hover-gold: #FFA500;
            --gradient-gold: linear-gradient(135deg, #FFD700 0%, #B8860B 100%);
            --shadow-3d: 0 10px 30px rgba(0,0,0,0.3);
            --shadow-hover: 0 20px 40px rgba(0,0,0,0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--primary-black);
            color: var(--accent-white);
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        header {
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--primary-gold);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: var(--gradient-gold);
            color: var(--primary-black);
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-3d);
        }

        /* Breadcrumb */
        .breadcrumb {
            padding: 20px 0;
            margin-top: 20px;
        }

        .breadcrumb-list {
            display: flex;
            list-style: none;
            gap: 15px;
            align-items: center;
        }

        .breadcrumb-item {
            color: #ccc;
            font-size: 0.9rem;
        }

        .breadcrumb-item:not(:last-child)::after {
            content: '/';
            margin-right: 15px;
            color: var(--primary-gold);
        }

        .breadcrumb-item a {
            color: var(--primary-gold);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .breadcrumb-item a:hover {
            color: var(--hover-gold);
        }

        /* Product Details Section */
        .product-details {
            padding: 50px 0;
            background: var(--secondary-black);
        }

        .product-details-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: start;
        }

        /* Product Images */
        .product-images {
            position: relative;
        }

        .main-image-container {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            transform: perspective(1000px) rotateY(-5deg);
            transition: all 0.3s ease;
        }

        .main-image-container:hover {
            transform: perspective(1000px) rotateY(0deg) scale(1.02);
            box-shadow: 0 20px 40px rgba(255, 215, 0, 0.2);
        }

        .main-image {
            width: 100%;
            height: 500px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .main-image-container:hover .main-image {
            transform: scale(1.1);
        }

        .image-zoom {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 215, 0, 0.9);
            color: var(--primary-black);
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .image-zoom:hover {
            background: var(--primary-gold);
            transform: scale(1.1);
        }

        .thumbnail-images {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .thumbnail {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            transform: perspective(500px) rotateX(10deg);
        }

        .thumbnail:hover,
        .thumbnail.active {
            border-color: var(--primary-gold);
            transform: perspective(500px) rotateX(0deg) scale(1.1);
        }

        /* Product Info */
        .product-info {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            transform: perspective(1000px) rotateY(5deg);
            transition: all 0.3s ease;
        }

        .product-info:hover {
            transform: perspective(1000px) rotateY(0deg);
            border-color: var(--primary-gold);
            box-shadow: 0 20px 40px rgba(255, 215, 0, 0.1);
        }

        .product-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--primary-gold);
            line-height: 1.3;
        }

        .product-rating-section {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .rating-stars {
            display: flex;
            gap: 5px;
            font-size: 1.2rem;
        }

        .stars-filled {
            color: var(--primary-gold);
        }

        .stars-empty {
            color: #444;
        }

        .rating-text {
            font-weight: 600;
            color: var(--primary-gold);
        }

        .reviews-count {
            color: #ccc;
            font-size: 0.9rem;
        }

        .product-price-section {
            margin-bottom: 30px;
            padding: 25px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 15px;
            border: 2px solid var(--primary-gold);
            position: relative;
            overflow: hidden;
        }

        .product-price-section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 215, 0, 0.1), transparent);
            transform: rotate(45deg);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .current-price {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-gold);
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .original-price {
            font-size: 1.5rem;
            color: #888;
            text-decoration: line-through;
            margin-right: 15px;
            position: relative;
            z-index: 1;
        }

        .discount-badge {
            display: inline-block;
            padding: 5px 15px;
            background: var(--gradient-gold);
            color: var(--primary-black);
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            position: relative;
            z-index: 1;
        }

        .product-description {
            margin-bottom: 30px;
            line-height: 1.8;
            color: #ccc;
            font-size: 1.1rem;
        }

        .product-features {
            margin-bottom: 30px;
        }

        .product-features h4 {
            color: var(--primary-gold);
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .features-list {
            list-style: none;
        }

        .features-list li {
            padding: 8px 0;
            color: #ccc;
            position: relative;
            padding-right: 25px;
        }

        .features-list li::before {
            content: '✓';
            position: absolute;
            right: 0;
            color: var(--primary-gold);
            font-weight: bold;
            font-size: 1.2rem;
        }

        .product-actions {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn-add-cart-large {
            flex: 1;
            min-width: 200px;
            padding: 18px 30px;
            background: var(--gradient-gold);
            color: var(--primary-black);
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-3d);
            position: relative;
            overflow: hidden;
        }

        .btn-add-cart-large::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn-add-cart-large:hover::before {
            left: 100%;
        }

        .btn-add-cart-large:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-hover);
        }

        .btn-favorite-large {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: transparent;
            border: 2px solid var(--primary-gold);
            color: var(--primary-gold);
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-favorite-large:hover,
        .btn-favorite-large.active {
            background: var(--primary-gold);
            color: var(--primary-black);
            transform: scale(1.1);
        }

        .product-meta {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 30px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .meta-icon {
            color: var(--primary-gold);
            font-size: 1.2rem;
        }

        .meta-label {
            color: #ccc;
            font-size: 0.9rem;
        }

        .meta-value {
            color: var(--accent-white);
            font-weight: 600;
        }

        /* Reviews Section */
        .reviews-section {
            padding: 60px 0;
            background: var(--primary-black);
        }

        .reviews-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .reviews-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--primary-gold);
        }

        .add-review-btn {
            padding: 12px 25px;
            background: var(--gradient-gold);
            color: var(--primary-black);
            border: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-review-btn:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-3d);
        }

        .reviews-summary {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 40px;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .overall-rating {
            text-align: center;
            padding: 30px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 15px;
            border: 2px solid var(--primary-gold);
        }

        .overall-rating-number {
            font-size: 4rem;
            font-weight: 700;
            color: var(--primary-gold);
            line-height: 1;
        }

        .overall-rating-stars {
            margin: 15px 0;
            font-size: 1.5rem;
        }

        .total-reviews {
            color: #ccc;
            font-size: 1.1rem;
        }

        .rating-breakdown {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .rating-bar {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .rating-label {
            min-width: 60px;
            color: var(--primary-gold);
            font-weight: 600;
        }

        .rating-progress {
            flex: 1;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        .rating-progress-fill {
            height: 100%;
            background: var(--gradient-gold);
            border-radius: 5px;
            transition: width 0.3s ease;
        }

        .rating-count {
            min-width: 40px;
            text-align: left;
            color: #ccc;
        }

        .reviews-list {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .review-card {
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            transition: all 0.3s ease;
            transform: perspective(500px) rotateX(2deg);
        }

        .review-card:hover {
            transform: perspective(500px) rotateX(0deg);
            border-color: var(--primary-gold);
            box-shadow: 0 15px 30px rgba(255, 215, 0, 0.1);
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .reviewer-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .reviewer-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-gold);
        }

        .reviewer-details h4 {
            color: var(--primary-gold);
            margin-bottom: 5px;
        }

        .review-date {
            color: #888;
            font-size: 0.9rem;
        }

        .verified-purchase {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .review-content {
            margin-bottom: 20px;
        }

        .review-text {
            color: #ccc;
            line-height: 1.7;
            margin-bottom: 15px;
        }

        .review-images {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .review-image {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .review-image:hover {
            transform: scale(1.1);
        }

        .review-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 215, 0, 0.2);
        }

        .review-actions {
            display: flex;
            gap: 15px;
        }

        .review-action {
            background: none;
            border: none;
            color: #ccc;
            cursor: pointer;
            transition: color 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .review-action:hover {
            color: var(--primary-gold);
        }

        /* Related Products */
        .related-products {
            padding: 60px 0;
            background: var(--secondary-black);
        }

        .related-products h2 {
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--primary-gold);
            margin-bottom: 50px;
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }

        /* Review Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) perspective(1000px) rotateX(5deg);
            background: var(--secondary-black);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            max-height: 90%;
            overflow-y: auto;
            border: 2px solid var(--primary-gold);
            transition: all 0.3s ease;
        }

        .modal-content:hover {
            transform: translate(-50%, -50%) perspective(1000px) rotateX(0deg);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
        }

        .modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--primary-gold);
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--primary-gold);
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .close-btn:hover {
            transform: rotate(90deg);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            margin-bottom: 10px;
            color: var(--primary-gold);
            font-weight: 500;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent-white);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--primary-gold);
            background: rgba(255, 255, 255, 0.1);
        }

        .form-textarea {
            resize: vertical;
            min-height: 120px;
        }

        .star-rating {
            display: flex;
            gap: 10px;
            font-size: 2rem;
            margin: 10px 0;
        }

        .star {
            cursor: pointer;
            color: #444;
            transition: all 0.3s ease;
        }

        .star:hover,
        .star.active {
            color: var(--primary-gold);
            transform: scale(1.2);
        }

        .submit-review-btn {
            width: 100%;
            padding: 15px;
            background: var(--gradient-gold);
            color: var(--primary-black);
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-review-btn:hover {
            transform: scale(1.02);
            box-shadow: var(--shadow-3d);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .product-details-container {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .product-title {
                font-size: 2rem;
            }

            .current-price {
                font-size: 2rem;
            }

            .product-actions {
                flex-direction: column;
            }

            .btn-add-cart-large {
                min-width: auto;
            }

            .product-meta {
                grid-template-columns: 1fr;
            }

            .reviews-summary {
                grid-template-columns: 1fr;
            }

            .reviews-header {
                flex-direction: column;
                text-align: center;
            }

            .modal-content {
                padding: 30px 20px;
            }
        }

        /* Loading Animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 215, 0, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary-gold);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Success Animation */
        @keyframes success-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .success-animation {
            animation: success-pulse 0.5s ease-in-out;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">الماسة</div>
                <a href="index.html" class="back-btn">
                    <i class="fas fa-arrow-right"></i>
                    العودة للمتجر
                </a>
            </div>
        </div>
    </header>

    <!-- Breadcrumb -->
    <nav class="breadcrumb">
        <div class="container">
            <ul class="breadcrumb-list">
                <li class="breadcrumb-item"><a href="index.html">الرئيسية</a></li>
                <li class="breadcrumb-item"><a href="index.html#products">المنتجات</a></li>
                <li class="breadcrumb-item"><a href="#" id="categoryBreadcrumb">الفئة</a></li>
                <li class="breadcrumb-item" id="productBreadcrumb">اسم المنتج</li>
            </ul>
        </div>
    </nav>

    <!-- Product Details -->
    <section class="product-details">
        <div class="container">
            <div class="product-details-container">
                <!-- Product Images -->
                <div class="product-images">
                    <div class="main-image-container">
                        <img src="" alt="المنتج" class="main-image" id="mainImage">
                        <div class="image-zoom">
                            <i class="fas fa-search-plus"></i>
                        </div>
                    </div>
                    <div class="thumbnail-images" id="thumbnails">
                        <!-- Thumbnails will be loaded here -->
                    </div>
                </div>

                <!-- Product Info -->
                <div class="product-info">
                    <h1 class="product-title" id="productTitle">اسم المنتج</h1>
                    
                    <div class="product-rating-section">
                        <div class="rating-stars" id="ratingStars">
                            <!-- Rating stars will be loaded here -->
                        </div>
                        <div class="rating-text" id="ratingText">4.8</div>
                        <div class="reviews-count" id="reviewsCount">(120 تقييم)</div>
                    </div>

                    <div class="product-price-section">
                        <div class="current-price" id="currentPrice">8,500 دج</div>
                        <div class="original-price" id="originalPrice">10,000 دج</div>

                    </div>

                    <div class="product-description" id="productDescription">

    <!-- Reviews Section -->
    <section class="reviews-section">

    <section class="related-products">

    <!-- Review Modal -->
    <div class="modal" id="reviewModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">أضف تقييمك</h3>
                <button class="close-btn" onclick="closeReviewModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <form id="reviewForm" onsubmit="submitReview(event)">
                <div class="form-group">
                    <label class="form-label">التقييم</label>
                    <div class="star-rating" id="starRating">
                        <span class="star" data-rating="1">★</span>
                        <span class="star" data-rating="2">★</span>
                        <span class="star" data-rating="3">★</span>
                        <span class="star" data-rating="4">★</span>
                        <span class="star" data-rating="5">★</span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">الاسم</label>
                    <input type="text" class="form-input" id="reviewerName" required>
                </div>

                <div class="form-group">
                    <label class="form-label">التعليق</label>
                    <textarea class="form-textarea" id="reviewComment" required></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">صورة (اختياري)</label>
                    <input type="file" class="form-input" id="reviewImage" accept="image/*">

n                <button type="submit" class="submit-review-btn">
                    <span>إرسال التقييم</span>
                </button>

    <script>
        // Global variables
        let currentProduct = null;
        let currentRating = 0;
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let favorites = JSON.parse(localStorage.getItem('favorites')) || [];

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            loadProductDetails();
            loadReviews();
            initializeStarRating();
        });

        // Load product details from URL parameter
        async function loadProductDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (!productId) {
                showNotification('لم يتم تحديد المنتج', 'error');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
                return;
            }

            try {
                // Try to load from API
                const response = await fetch(`tables/products/${productId}`);
                if (response.ok) {
                    currentProduct = await response.json();
                } else {
                    // Fallback to sample data
                    currentProduct = getSampleProduct(productId);
                }
            } catch (error) {
                console.error('Error loading product:', error);
                currentProduct = getSampleProduct(productId);
            }

            displayProductDetails();
            loadRelatedProducts();
        }

        // Display product details
        function displayProductDetails() {
            if (!currentProduct) return;

            // Update breadcrumb
            document.getElementById('categoryBreadcrumb').textContent = currentProduct.category;
            document.getElementById('categoryBreadcrumb').href = `index.html?category=${currentProduct.category}`;
            document.getElementById('productBreadcrumb').textContent = currentProduct.name;

            // Update main content
            document.getElementById('productTitle').textContent = currentProduct.name;
            document.getElementById('mainImage').src = currentProduct.image_url;
            document.getElementById('mainImage').alt = currentProduct.name;
            document.getElementById('currentPrice').textContent = `${currentProduct.price.toLocaleString()} دج`;
            document.getElementById('productDescription').textContent = currentProduct.description;
            document.getElementById('categoryValue').textContent = currentProduct.category;
            document.getElementById('colorValue').textContent = currentProduct.color;
            document.getElementById('materialValue').textContent = currentProduct.material || 'ذهب عيار 18';
            document.getElementById('stockValue').textContent = currentProduct.stock > 0 ? 'متوفر' : 'غير متوفر';

            // Update rating
            updateRatingDisplay();

            // Update features
            const featuresList = document.getElementById('featuresList');
            const features = [
                'صناعة يدوية بأعلى جودة',
                'تصميم عصري يناسب جميع المناسبات',
                'مادة خام عالية الجودة',
                'ضمان لمدة عام',
                'تغليف فاخر مناسب للهدية'
            ];

            featuresList.innerHTML = features.map(feature => `<li>${feature}</li>`).join('');

            // Update favorite button state
            updateFavoriteButton();

            // Load thumbnails
            loadThumbnails();
        }

        // Load thumbnails
        function loadThumbnails() {
            const thumbnails = [
                currentProduct.image_url,
                'https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=400&h=400&fit=crop',
                'https://images.unsplash.com/photo-1602751584552-8ba73aad10e1?w=400&h=400&fit=crop',
                'https://images.unsplash.com/photo-1599643477877-530eb83a9645?w=400&h=400&fit=crop'
            ];

            const thumbnailsContainer = document.getElementById('thumbnails');
            thumbnailsContainer.innerHTML = thumbnails.map((img, index) => `
                <img src="${img}" alt="صورة ${index + 1}" class="thumbnail ${index === 0 ? 'active' : ''}" 
                     onclick="changeMainImage('${img}', this)">
            `).join('');
        }

        // Change main image
        function changeMainImage(imageSrc, thumbnailElement) {
            document.getElementById('mainImage').src = imageSrc;
            
            // Update active thumbnail
            document.querySelectorAll('.thumbnail').forEach(thumb => thumb.classList.remove('active'));
            thumbnailElement.classList.add('active');
        }

        // Update rating display
        function updateRatingDisplay() {
            const rating = currentProduct.rating || 4.8;
            const reviewsCount = currentProduct.reviews_count || 120;

            document.getElementById('ratingText').textContent = rating.toFixed(1);
            document.getElementById('reviewsCount').textContent = `(${reviewsCount} تقييم)`;

            // Update stars
            const ratingStars = document.getElementById('ratingStars');
            ratingStars.innerHTML = getStars(rating);
        }

        // Get stars HTML
        function getStars(rating) {
            const fullStars = Math.floor(rating);
            const hasHalfStar = rating % 1 !== 0;
            let stars = '';

            for (let i = 0; i < fullStars; i++) {
                stars += '<i class="fas fa-star stars-filled"></i>';
            }
            if (hasHalfStar) {
                stars += '<i class="fas fa-star-half-alt stars-filled"></i>';
            }
            for (let i = fullStars + (hasHalfStar ? 1 : 0); i < 5; i++) {
                stars += '<i class="far fa-star stars-empty"></i>';
            }

            return stars;
        }

        // Add to cart
        function addToCart() {
            if (!currentProduct) return;

            if (cart.includes(currentProduct.id)) {
                showNotification('هذا المنتج موجود بالفعل في السلة', 'warning');
                return;
            }

            cart.push(currentProduct.id);
            localStorage.setItem('cart', JSON.stringify(cart));
            
            // Add success animation
            const cartBtn = document.querySelector('.btn-add-cart-large');
            cartBtn.classList.add('success-animation');
            
            showNotification('تمت إضافة المنتج إلى السلة بنجاح!', 'success');
            
            setTimeout(() => {
                cartBtn.classList.remove('success-animation');
            }, 500);
        }

        // Toggle favorite
        function toggleFavorite() {
            if (!currentProduct) return;

            const index = favorites.indexOf(currentProduct.id);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(currentProduct.id);
            }

            localStorage.setItem('favorites', JSON.stringify(favorites));
            updateFavoriteButton();
            
            const action = index > -1 ? 'حذف من' : 'إضافة إلى';
            showNotification(`تم ${action} المفضلة بنجاح!`);
        }

        // Update favorite button
        function updateFavoriteButton() {
            const favoriteBtn = document.getElementById('favoriteBtn');
            const isFavorite = favorites.includes(currentProduct.id);
            
            favoriteBtn.innerHTML = isFavorite ? '<i class="fas fa-heart"></i>' : '<i class="far fa-heart"></i>';
            favoriteBtn.classList.toggle('active', isFavorite);
        }

        // Load reviews
        async function loadReviews() {
            if (!currentProduct) return;

            try {
                const response = await fetch(`tables/reviews?product_id=${currentProduct.id}`);
                const data = await response.json();
                const reviews = data.data;
                displayReviews(reviews);
            } catch (error) {
                console.error('Error loading reviews:', error);
                // Fallback to sample reviews
                const reviews = getSampleReviews();
                displayReviews(reviews);
            }
        }

        // Display reviews
        function displayReviews(reviews) {
            displayReviewsSummary(reviews);
            displayReviewsList(reviews);
        }

        // Display reviews summary
        function displayReviewsSummary(reviews) {
            const summaryContainer = document.getElementById('reviewsSummary');
            
            const avgRating = reviews.reduce((sum, review) => sum + review.rating, 0) / reviews.length || 4.8;
            const totalReviews = reviews.length || 120;

            // Calculate rating distribution
            const ratingDist = [0, 0, 0, 0, 0];
            reviews.forEach(review => {
                ratingDist[Math.floor(review.rating) - 1]++;
            });

            summaryContainer.innerHTML = `
                <div class="overall-rating">
                    <div class="overall-rating-number">${avgRating.toFixed(1)}</div>
                    <div class="overall-rating-stars">${getStars(avgRating)}</div>
                    <div class="total-reviews">من ${totalReviews} تقييم</div>
                </div>
                <div class="rating-breakdown">
                    ${[5, 4, 3, 2, 1].map((rating, index) => {
                        const count = ratingDist[4 - index] || 0;
                        const percentage = totalReviews > 0 ? (count / totalReviews * 100) : [60, 25, 10, 3, 2][index];
                        return `
                            <div class="rating-bar">
                                <div class="rating-label">${rating} نجوم</div>
                                <div class="rating-progress">
                                    <div class="rating-progress-fill" style="width: ${percentage}%"></div>
                                </div>
                                <div class="rating-count">${count}</div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        // Display reviews list
        function displayReviewsList(reviews) {
            const reviewsList = document.getElementById('reviewsList');
            
            if (reviews.length === 0) {
                reviewsList.innerHTML = '<p style="text-align: center; color: #ccc; font-size: 1.2rem;">لا توجد تقييمات بعد. كن أول من يقيّم هذا المنتج!</p>';
                return;
            }

            reviewsList.innerHTML = reviews.map(review => `
                <div class="review-card">
                    <div class="review-header">
                        <div class="reviewer-info">
                            <img src="https://images.unsplash.com/photo-1494790108755-2616b612b5bc?w=50&h=50&fit=crop&crop=face" 
                                 alt="${review.customer_name}" class="reviewer-avatar">
                            <div class="reviewer-details">
                                <h4>${review.customer_name}</h4>
                                <div class="review-date">${new Date(review.created_at).toLocaleDateString('ar-DZ')}</div>
                            </div>
                        </div>
                        <div>
                            <div class="rating-stars">${getStars(review.rating)}</div>
                            ${review.verified_purchase ? '<div class="verified-purchase"><i class="fas fa-check-circle"></i> تم التحقق من الشراء</div>' : ''}
                        </div>
                    </div>
                    <div class="review-content">
                        <div class="review-text">${review.comment}</div>
                        ${review.image_url ? `
                            <div class="review-images">
                                <img src="${review.image_url}" alt="صورة التقييم" class="review-image" onclick="openImageModal('${review.image_url}')">
                            </div>
                        ` : ''}
                    </div>
                    <div class="review-footer">
                        <div class="review-actions">
                            <button class="review-action" onclick="likeReview('${review.id}')">
                                <i class="far fa-thumbs-up"></i>
                                <span>مفيد</span>
                            </button>
                            <button class="review-action" onclick="reportReview('${review.id}')">
                                <i class="far fa-flag"></i>
                                <span>إبلاغ</span>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Load related products
        async function loadRelatedProducts() {
            if (!currentProduct) return;

            try {
                const response = await fetch(`tables/products?category=${currentProduct.category}&limit=4`);
                const data = await response.json();
                const relatedProducts = data.data.filter(p => p.id !== currentProduct.id).slice(0, 4);
                displayRelatedProducts(relatedProducts);
            } catch (error) {
                console.error('Error loading related products:', error);
                // Fallback to sample related products
                const relatedProducts = getSampleRelatedProducts();
                displayRelatedProducts(relatedProducts);
            }
        }

        // Display related products
        function displayRelatedProducts(products) {
            const relatedGrid = document.getElementById('relatedGrid');
            
            relatedGrid.innerHTML = products.map(product => `
                <div class="product-card" onclick="window.location.href='product.html?id=${product.id}'">
                    <img src="${product.image_url}" alt="${product.name}" class="product-card-image">
                    <div class="product-card-content">
                        <h3 class="product-card-title">${product.name}</h3>
                        <div class="product-price">${product.price.toLocaleString()} دج</div>
                        <div class="product-rating">
                            <div class="stars">${getStars(product.rating)}</div>
                            <span>(${product.reviews_count})</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Open review modal
        function openReviewModal() {
            document.getElementById('reviewModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        // Close review modal
        function closeReviewModal() {
            document.getElementById('reviewModal').style.display = 'none';
            document.body.style.overflow = 'auto';
            // Reset form
            document.getElementById('reviewForm').reset();
            currentRating = 0;
            updateStarRating();
        }

        // Initialize star rating
        function initializeStarRating() {
            const stars = document.querySelectorAll('.star');
            stars.forEach(star => {
                star.addEventListener('click', function() {
                    currentRating = parseInt(this.dataset.rating);
                    updateStarRating();
                });

                star.addEventListener('mouseenter', function() {
                    const rating = parseInt(this.dataset.rating);
                    highlightStars(rating);
                });
            });

            document.getElementById('starRating').addEventListener('mouseleave', function() {
                updateStarRating();
            });
        }

        // Update star rating display
        function updateStarRating() {
            highlightStars(currentRating);
        }

        // Highlight stars
        function highlightStars(rating) {
            const stars = document.querySelectorAll('.star');
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }

        // Submit review
        async function submitReview(event) {
            event.preventDefault();
            
            if (!currentProduct) return;
            if (currentRating === 0) {
                showNotification('يرجى اختيار تقييم', 'warning');
                return;
            }

            const formData = {
                product_id: currentProduct.id,
                customer_name: document.getElementById('reviewerName').value,
                rating: currentRating,
                comment: document.getElementById('reviewComment').value,
                verified_purchase: Math.random() > 0.5, // Random for demo
                created_at: new Date().toISOString()
            };

            try {
                const response = await fetch('tables/reviews', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    showNotification('تم إرسال تقييمك بنجاح!', 'success');
                    closeReviewModal();
                    loadReviews(); // Reload reviews
                } else {
                    throw new Error('Failed to submit review');
                }
            } catch (error) {
                console.error('Error submitting review:', error);
                showNotification('حدث خطأ أثناء إرسال التقييم', 'error');
            }
        }

        // Show notification
        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 100px;
                right: 20px;
                background: ${type === 'success' ? 'var(--primary-gold)' : type === 'error' ? '#ff6b6b' : '#ffa726'};
                color: var(--primary-black);
                padding: 15px 25px;
                border-radius: 25px;
                font-weight: 600;
                z-index: 3000;
                transform: translateX(100%);
                transition: transform 0.3s ease;
                max-width: 300px;
                text-align: center;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.transform = 'translateX(0)';
            }, 100);

            setTimeout(() => {
                notification.style.transform = 'translateX(100%)';
                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 300);
            }, 3000);
        }

        // Sample data functions

                {

        // Utility functions
        function likeReview(reviewId) {
            showNotification('تم تسجيل إعجابك بالتقييم', 'success');
        }

        function reportReview(reviewId) {
            showNotification('تم إرسال بلاغك وسيتم مراجعته', 'warning');
        }

        function openImageModal(imageUrl) {
            window.open(imageUrl, '_blank');
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('reviewModal');
            if (event.target === modal) {
                closeReviewModal();
            }
        }

        // Smooth scrolling for internal links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });
    </script>
</body>
